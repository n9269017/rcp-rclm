[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rcp-rclm-runtime-v5"
version = "0.1.0.dev0"
description = "Phase 17 horizon-independent control-plane development"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["rcp-rclm-runtime-v2", "rcp-rclm-runtime-v3", "rcp-rclm-runtime-v4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["rcp_rclm_runtime_v5*"]
