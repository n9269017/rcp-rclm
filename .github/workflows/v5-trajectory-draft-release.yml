name: Prepare RCP/RCLM v5 trajectory draft release

on:
  push:
    branches:
      - agent/v5-trajectory-release-draft-helper
    paths:
      - ".github/workflows/v5-trajectory-draft-release.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  TARGET_COMMIT: 075a0af7501e6f319d926d5bc9939f9b9cca4adf
  TAG: v5-trajectory
  TITLE: RCP/RCLM v5 Trajectory
  ASSET: rcp-rclm-v5-trajectory-roadmap.zip

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact merged roadmap commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ env.TARGET_COMMIT }}
          fetch-depth: 0

      - name: Verify exact roadmap commit and build deterministic assets
        shell: python
        run: |
          from __future__ import annotations

          import hashlib
          import json
          import os
          import subprocess
          import zipfile
          from pathlib import Path

          target = os.environ["TARGET_COMMIT"]
          observed = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          if observed != target:
              raise SystemExit(
                  f"exact target mismatch: expected={target} observed={observed}"
              )

          root = Path("docs/roadmaps/v5")
          expected = {
              "CITATION.cff",
              "DOI_AND_RELEASE_STRATEGY.md",
              "EGC_GENERAL_CAPABILITY_TRACK.md",
              "GITHUB_RELEASE_NOTES.md",
              "PHASE_17_TO_Z_TRAJECTORY.md",
              "PUBLICATION_AND_CLAIM_BOUNDARY.md",
              "README.md",
              "ROADMAP_MANIFEST.json",
              "SHA256SUMS.txt",
          }
          files = sorted(path for path in root.iterdir() if path.is_file())
          if {path.name for path in files} != expected:
              raise SystemExit("roadmap asset file set mismatch")

          manifest = json.loads(
              (root / "ROADMAP_MANIFEST.json").read_text(encoding="utf-8")
          )
          if manifest.get("title") != "RCP/RCLM v5 Trajectory":
              raise SystemExit("roadmap title mismatch")
          if manifest.get("version") != "v5-trajectory":
              raise SystemExit("roadmap version mismatch")
          if manifest.get("status", {}).get("roadmap_only") is not True:
              raise SystemExit("roadmap-only boundary mismatch")

          out = Path(os.environ["ASSET"])
          timestamp = (2026, 8, 11, 0, 0, 0)
          with zipfile.ZipFile(
              out,
              mode="w",
              compression=zipfile.ZIP_DEFLATED,
              compresslevel=9,
          ) as archive:
              for path in files:
                  relative = Path("rcp-rclm-v5-trajectory") / path.name
                  info = zipfile.ZipInfo(relative.as_posix(), date_time=timestamp)
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  info.create_system = 3
                  archive.writestr(info, path.read_bytes())

          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          checksum = Path(f"{out.name}.sha256")
          checksum.write_text(
              f"{digest}  {out.name}\n",
              encoding="ascii",
              newline="\n",
          )
          print(
              json.dumps(
                  {
                      "asset": out.name,
                      "asset_sha256": digest,
                      "asset_size": out.stat().st_size,
                      "member_count": len(files),
                      "target_commit": target,
                  },
                  sort_keys=True,
              )
          )

      - name: Create draft prerelease with roadmap-only assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing replacement." >&2
            exit 1
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_COMMIT" \
            --title "$TITLE" \
            --notes-file docs/roadmaps/v5/GITHUB_RELEASE_NOTES.md \
            --draft \
            --prerelease \
            "$ASSET" \
            "$ASSET.sha256"

      - name: Verify draft release identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,isDraft,isPrerelease,targetCommitish,assets,url
