name: Materialize complete Gate E checksum manifest

on:
  push:
    branches:
      - agent/rcp-rclm-v4-gate-e-successor-availability
    paths:
      - .github/workflows/gate-e-checksum-materializer.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact Gate E branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: agent/rcp-rclm-v4-gate-e-successor-availability
          fetch-depth: 0
          persist-credentials: true

      - name: Remove one-shot materializer from retained tree
        shell: bash
        run: git rm .github/workflows/gate-e-checksum-materializer.yml

      - name: Regenerate canonical tracked-file checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import re
          import subprocess
          from pathlib import Path

          manifest_path = "SHA256SUMS.txt"
          retired_workflow = ".github/workflows/gate-e-checksum-materializer.yml"
          raw_paths = subprocess.check_output(["git", "ls-files", "-z"])
          paths = sorted(
              item.decode("utf-8", "surrogateescape")
              for item in raw_paths.split(b"\0")
              if item
          )
          paths = [path for path in paths if path != manifest_path]

          if retired_workflow in paths:
              raise SystemExit("retired Gate E checksum workflow remains tracked")

          required_paths = {
              "lean/rcp_rclm_formal_core_v4/RcpRclmFormalCoreV4.lean",
              "lean/rcp_rclm_formal_core_v4/formalization_manifest.json",
              "python/rcp_rclm_executable_core_v4/contract/gate_e_autonomous_search.schema.json",
              "python/rcp_rclm_runtime_v4/rcp_rclm_runtime_v4/gatee/validation.py",
              "docs/formal_core_v4/GATE_E_THEOREM_CONTRACT.md",
              "docs/executable_core_v4/GATE_E_VALIDATION.md",
          }
          missing_required = sorted(required_paths - set(paths))
          if missing_required:
              raise SystemExit(f"required Gate E paths missing: {missing_required}")

          lines: list[str] = []
          observed: dict[str, str] = {}
          for path in paths:
              blob = subprocess.check_output(["git", "show", f":{path}"])
              digest = hashlib.sha256(blob).hexdigest()
              observed[path] = digest
              lines.append(f"{digest}  {path}\n")

          Path(manifest_path).write_text(
              "".join(lines),
              encoding="utf-8",
              newline="\n",
          )

          parsed: dict[str, str] = {}
          pattern = re.compile(r"^([0-9a-f]{64})  (.+)$")
          for line_number, line in enumerate(
              Path(manifest_path).read_text(encoding="utf-8").splitlines(),
              start=1,
          ):
              match = pattern.fullmatch(line)
              if match is None:
                  raise SystemExit(f"invalid checksum line {line_number}: {line!r}")
              digest, path = match.groups()
              if path in parsed:
                  raise SystemExit(f"duplicate checksum path: {path}")
              parsed[path] = digest

          if parsed != observed:
              raise SystemExit("checksum manifest differs from canonical Git blob digests")
          if manifest_path in parsed:
              raise SystemExit("checksum manifest includes itself")
          if retired_workflow in parsed:
              raise SystemExit("checksum manifest includes retired workflow")

          print(f"tracked files covered: {len(paths)}")
          print(f"manifest SHA-256: {hashlib.sha256(Path(manifest_path).read_bytes()).hexdigest()}")
          PY

      - name: Commit checksum manifest and retire materializer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SHA256SUMS.txt
          git diff --cached --check
          git commit -m "Regenerate complete Gate E checksum manifest"
          git push origin HEAD:agent/rcp-rclm-v4-gate-e-successor-availability
