name: Temporary Phase 14 semantic replay stability repair

on:
  push:
    branches:
      - agent/rcp-rclm-v4-phase-14-schedule-free-loop-v2
    paths:
      - .github/workflows/phase14-semantic-replay-stability-fix.yml

permissions:
  contents: write

env:
  TARGET_BRANCH: agent/rcp-rclm-v4-phase-14-schedule-free-loop-v2

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact Phase 14 branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install deterministic Runtime v2-v4 stack
        run: |
          python -m pip install --disable-pip-version-check --no-deps -e python/rcp_rclm_runtime_v2
          python -m pip install --disable-pip-version-check -e "python/rcp_rclm_runtime_v3[test]"
          python -m pip install --disable-pip-version-check -e "python/rcp_rclm_runtime_v4[test]"

      - name: Apply semantic replay stability repair
        shell: python
        run: |
          from pathlib import Path

          outer_path = Path(
              "python/rcp_rclm_runtime_v4/rcp_rclm_runtime_v4/phase14/outer.py"
          )
          text = outer_path.read_text(encoding="utf-8")

          if "from collections.abc import Mapping\n" not in text:
              anchor = "from __future__ import annotations\n\n"
              if text.count(anchor) != 1:
                  raise SystemExit("outer.py import anchor did not match exactly once")
              text = text.replace(
                  anchor,
                  anchor + "from collections.abc import Mapping\n",
                  1,
              )

          marker = "runtime.v4.phase14.hardened_checker_semantic.v1"
          if marker not in text:
              anchor = '''def directory_tree_hash(root: Path) -> str:
              return semantic_tree_hash(build_tree_records(root.resolve(strict=True)))


'''.replace("              ", "")
              if text.count(anchor) != 1:
                  raise SystemExit("outer.py helper insertion anchor did not match exactly once")
              helpers = r'''_PHASE3_COMPONENT_KEYS = (
    "structural_result",
    "typed_successor_result",
    "residual_result",
    "evaluation_result",
    "protected_nonloss_result",
    "recovery_result",
    "invariant_result",
    "containment_result",
    "progress_result",
    "strict_witness_result",
    "trust_result",
    "resource_result",
    "domain_result",
    "refinement_result",
    "monitor_result",
    "lean_bridge_result",
)


def _component_semantic_projection(value: object) -> object:
    if not isinstance(value, Mapping):
        return None
    return {
        "schema_id": value.get("schema_id"),
        "status": value.get("status"),
        "reason_codes": list(value.get("reason_codes", ())),
    }


def _lean_semantic_projection(
    report: Mapping[str, object],
    source_guard: Mapping[str, object],
) -> dict[str, object]:
    normalized_report = dict(report)
    normalized_report.pop("compiler_duration_ms", None)
    normalized_report.pop("toolchain_runtime_hash", None)
    return {
        "schema_id": "runtime.v4.phase14.lean_semantic_fingerprint.v1",
        "report": normalized_report,
        "source_guard": dict(source_guard),
    }


def _checker_semantic_projection(value: Mapping[str, object]) -> dict[str, object]:
    checker = value.get("checker_report")
    checker_projection: dict[str, object] | None = None
    if isinstance(checker, Mapping):
        checker_projection = {
            key: checker.get(key)
            for key in (
                "schema_id",
                "contract_version",
                "transition_id",
                "verdict",
                "accepted",
                "reason_codes",
                "computed_residuals",
                "metric_bounds",
                "checker_policy_hash",
            )
        }
        for key in _PHASE3_COMPONENT_KEYS:
            checker_projection[key] = _component_semantic_projection(
                checker.get(key)
            )
    return {
        "schema_id": "runtime.v4.phase14.hardened_checker_semantic.v1",
        "contract_version": value.get("contract_version"),
        "transition_id": value.get("transition_id"),
        "verdict": value.get("verdict"),
        "accepted": value.get("accepted"),
        "reason_codes": value.get("reason_codes"),
        "integrity_result": _component_semantic_projection(
            value.get("integrity_result")
        ),
        "checker_report": checker_projection,
    }


'''
              text = text.replace(anchor, anchor + helpers, 1)

          old = '''        lean_hash = canonical_json_hash(
              {
                  "report": lean.report.to_json(),
                  "source_guard": lean.source_guard.to_json(),
              }
          )
          checker_hash = hardened.report_hash
'''.replace("          ", "")
          new = '''        lean_hash = canonical_json_hash(
              _lean_semantic_projection(
                  lean.report.to_json(),
                  lean.source_guard.to_json(),
              )
          )
          checker_hash = canonical_json_hash(
              _checker_semantic_projection(hardened.to_json())
          )
'''.replace("          ", "")
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit("outer.py verification block matched more than once")
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("outer.py verification block was neither old nor repaired")

          outer_path.write_text(text, encoding="utf-8", newline="\n")

          cli_path = Path(
              "python/rcp_rclm_runtime_v4/tools/replay_phase14_bundle.py"
          )
          cli = cli_path.read_text(encoding="utf-8")
          old_cli = '    parser.add_argument("--lean-project-root", type=Path)\n'
          new_cli = '''    parser.add_argument(
              "--lean-project-root",
              type=Path,
              default=Path("lean/rcp_rclm_formal_core_v3"),
          )
'''.replace("          ", "")
          if old_cli in cli:
              if cli.count(old_cli) != 1:
                  raise SystemExit("replay CLI Lean option matched more than once")
              cli = cli.replace(old_cli, new_cli, 1)
          elif new_cli not in cli:
              raise SystemExit("replay CLI Lean option was neither old nor repaired")
          cli_path.write_text(cli, encoding="utf-8", newline="\n")

          workflow_path = Path(".github/workflows/runtime-v4-phase-14.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          command_anchor = '''          python python/rcp_rclm_runtime_v4/tools/replay_phase14_bundle.py
          --bundle-root artifacts/runtime_v4_phase14/capture_export/phase14_bundle
          --repo-root .
          --source-head "$PHASE14_SOURCE_HEAD"
'''
          command_repaired = '''          python python/rcp_rclm_runtime_v4/tools/replay_phase14_bundle.py
          --bundle-root artifacts/runtime_v4_phase14/capture_export/phase14_bundle
          --repo-root .
          --lean-project-root lean/rcp_rclm_formal_core_v3
          --source-head "$PHASE14_SOURCE_HEAD"
'''
          if command_anchor in workflow:
              if workflow.count(command_anchor) != 1:
                  raise SystemExit("capture replay command matched more than once")
              workflow = workflow.replace(command_anchor, command_repaired, 1)
          elif command_repaired not in workflow:
              raise SystemExit("capture replay command was neither old nor repaired")
          workflow_path.write_text(workflow, encoding="utf-8", newline="\n")

          test_path = Path(
              "python/rcp_rclm_runtime_v4/tests_phase14/"
              "test_phase14_outer_semantics.py"
          )
          test_path.write_text(
              '''from __future__ import annotations

import copy
import unittest

from rcp_rclm_runtime.canonical.hashing import canonical_json_hash
from rcp_rclm_runtime_v4.phase14.outer import (
    _checker_semantic_projection,
    _lean_semantic_projection,
)


class Phase14OuterSemanticTests(unittest.TestCase):
    def test_lean_projection_ignores_only_runtime_metadata(self) -> None:
        first = {
            "bridge_verdict": "accept",
            "reason_codes": [],
            "packet_hash": "a" * 64,
            "theorem_surface_hash": "b" * 64,
            "compiler_duration_ms": 10,
            "toolchain_runtime_hash": "c" * 64,
        }
        second = copy.deepcopy(first)
        second["compiler_duration_ms"] = 999
        second["toolchain_runtime_hash"] = "d" * 64
        guard = {"clean": True, "findings": []}
        self.assertEqual(
            canonical_json_hash(_lean_semantic_projection(first, guard)),
            canonical_json_hash(_lean_semantic_projection(second, guard)),
        )
        second["packet_hash"] = "e" * 64
        self.assertNotEqual(
            canonical_json_hash(_lean_semantic_projection(first, guard)),
            canonical_json_hash(_lean_semantic_projection(second, guard)),
        )

    def test_checker_projection_retains_verdicts_not_artifact_hashes(self) -> None:
        component = {
            "schema_id": "runtime.phase3_component_result.v2",
            "status": "pass",
            "reason_codes": [],
            "evidence": {"invocation_hash": "a" * 64},
        }
        first = {
            "schema_id": "runtime.phase4_hardened_checker_report.v2",
            "contract_version": "test",
            "transition_id": "phase14-test",
            "verdict": "accept",
            "accepted": True,
            "reason_codes": [],
            "integrity_result": component,
            "artifact_hashes": {"request": "b" * 64},
            "checker_report": {
                "schema_id": "runtime.phase3_checker_report.v2",
                "contract_version": "test",
                "transition_id": "phase14-test",
                "verdict": "accept",
                "accepted": True,
                "reason_codes": [],
                "computed_residuals": [],
                "metric_bounds": None,
                "checker_policy_hash": "c" * 64,
                "artifact_hashes": {"request": "d" * 64},
                "structural_result": component,
            },
        }
        second = copy.deepcopy(first)
        second["artifact_hashes"]["request"] = "e" * 64
        second["integrity_result"]["evidence"] = {
            "invocation_hash": "f" * 64
        }
        second["checker_report"]["artifact_hashes"]["request"] = "1" * 64
        second["checker_report"]["structural_result"]["evidence"] = {
            "invocation_hash": "2" * 64
        }
        self.assertEqual(
            canonical_json_hash(_checker_semantic_projection(first)),
            canonical_json_hash(_checker_semantic_projection(second)),
        )
        second["checker_report"]["structural_result"]["status"] = "fail"
        self.assertNotEqual(
            canonical_json_hash(_checker_semantic_projection(first)),
            canonical_json_hash(_checker_semantic_projection(second)),
        )


if __name__ == "__main__":
    unittest.main()
''',
              encoding="utf-8",
              newline="\n",
          )

      - name: Compile and validate repaired Phase 14 source
        run: |
          python -m compileall -q \
            python/rcp_rclm_runtime_v4 \
            scripts/run_phase14_trajectory.py \
            scripts/build_phase14_bundle.py \
            scripts/replay_phase14_bundle.py \
            scripts/run_phase14_attacks.py \
            scripts/close_phase14.py
          python python/rcp_rclm_runtime_v4/tools/validate_source_quality.py \
            --package-root python/rcp_rclm_runtime_v4 \
            --out /tmp/phase14_source_quality.json
          python python/rcp_rclm_runtime_v4/tools/run_phase14_tests.py \
            --package-root python/rcp_rclm_runtime_v4 \
            --out /tmp/phase14_tests.log

      - name: Remove transport workflow and regenerate SHA256SUMS
        shell: python
        run: |
          import hashlib
          import subprocess
          from pathlib import Path

          temporary = Path(
              ".github/workflows/phase14-semantic-replay-stability-fix.yml"
          )
          temporary.unlink()

          raw = subprocess.check_output(
              [
                  "git",
                  "ls-files",
                  "-co",
                  "--exclude-standard",
                  "-z",
              ]
          )
          paths = [
              value.decode("utf-8")
              for value in raw.split(b"\0")
              if value
          ]
          retained = sorted(
              (
                  path
                  for path in paths
                  if path
                  not in {
                      "SHA256SUMS.txt",
                      str(temporary),
                  }
              ),
              key=lambda path: path.encode("utf-8"),
          )
          lines = [
              f"{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}"
              for path in retained
          ]
          Path("SHA256SUMS.txt").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
              newline="\n",
          )

      - name: Commit exact final replay repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No repair was required"
            exit 1
          fi
          git commit -m "Stabilize Phase 14 pinned semantic replay"
          git push origin HEAD:"$TARGET_BRANCH"
