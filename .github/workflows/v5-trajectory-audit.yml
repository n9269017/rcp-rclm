name: Audit RCP/RCLM v5 trajectory roadmap

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/v5-trajectory-audit.yml"
      - ".github/workflows/v45-results-only-audit.yml"
      - "README.md"
      - "RELEASE_NOTES.md"
      - "SHA256SUMS.txt"
      - "docs/roadmaps/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/v5-trajectory-audit.yml"
      - ".github/workflows/v45-results-only-audit.yml"
      - "README.md"
      - "RELEASE_NOTES.md"
      - "SHA256SUMS.txt"
      - "docs/roadmaps/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v5-trajectory-audit-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  ROADMAP_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  roadmap-audit:
    name: V5 trajectory audit (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: ubuntu
          - os: windows-2025
            label: windows
          - os: macos-15
            label: macos
    steps:
      - name: Check out exact roadmap head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ env.ROADMAP_SOURCE_HEAD }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Validate roadmap, status, and checksums
        shell: python
        run: |
          from __future__ import annotations

          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          EXPECTED_HEAD = os.environ["ROADMAP_SOURCE_HEAD"]
          ROOT = Path("docs/roadmaps/v5")
          REQUIRED = {
              "CITATION.cff",
              "DOI_AND_RELEASE_STRATEGY.md",
              "EGC_GENERAL_CAPABILITY_TRACK.md",
              "GITHUB_RELEASE_NOTES.md",
              "PHASE_17_TO_Z_TRAJECTORY.md",
              "PUBLICATION_AND_CLAIM_BOUNDARY.md",
              "README.md",
              "ROADMAP_MANIFEST.json",
              "SHA256SUMS.txt",
          }
          FORBIDDEN_SUFFIXES = {
              ".py", ".lean", ".yml", ".yaml", ".sh", ".ps1", ".bat",
              ".c", ".h", ".cpp", ".rs", ".go", ".java", ".js", ".ts",
          }

          def output(*args: str) -> str:
              return subprocess.check_output(args, text=True).strip()

          def git_blob_sha256(relative: str) -> str:
              payload = subprocess.check_output(
                  ["git", "cat-file", "blob", f"HEAD:{relative}"]
              )
              return hashlib.sha256(payload).hexdigest()

          if output("git", "rev-parse", "HEAD") != EXPECTED_HEAD:
              raise SystemExit("exact-head checkout mismatch")

          files = sorted(path for path in ROOT.rglob("*") if path.is_file())
          observed = {path.name for path in files}
          if observed != REQUIRED:
              raise SystemExit(
                  f"roadmap file set mismatch: expected={sorted(REQUIRED)} "
                  f"observed={sorted(observed)}"
              )

          leaked = [
              path.as_posix()
              for path in files
              if path.suffix.lower() in FORBIDDEN_SUFFIXES
          ]
          if leaked:
              raise SystemExit(f"implementation-source extension in roadmap: {leaked}")

          listed = {}
          for line in (ROOT / "SHA256SUMS.txt").read_text(
              encoding="utf-8"
          ).splitlines():
              digest, relative = line.split("  ", 1)
              listed[relative] = digest
          actual = {
              path.relative_to(ROOT).as_posix(): git_blob_sha256(path.as_posix())
              for path in files
              if path.name != "SHA256SUMS.txt"
          }
          if listed != actual or len(actual) != 8:
              missing = sorted(set(actual) - set(listed))
              extra = sorted(set(listed) - set(actual))
              mismatch = sorted(
                  name for name in set(actual) & set(listed)
                  if actual[name] != listed[name]
              )
              raise SystemExit(
                  f"roadmap checksum mismatch: missing={missing} "
                  f"extra={extra} mismatch={mismatch}"
              )

          manifest = json.loads(
              (ROOT / "ROADMAP_MANIFEST.json").read_text(encoding="utf-8")
          )
          if manifest.get("title") != "RCP/RCLM v5 Trajectory":
              raise SystemExit("roadmap title mismatch")
          if manifest.get("version") != "v5-trajectory":
              raise SystemExit("roadmap version mismatch")
          if manifest.get("trajectory") != ["17", "18", "X", "Y", "Omega", "Z"]:
              raise SystemExit("trajectory order mismatch")
          if manifest.get("empirical_track") != [
              "EGC-0", "EGC-1", "EGC-2", "EGC-3",
              "EGC-4", "EGC-5", "EGC-6",
          ]:
              raise SystemExit("EGC order mismatch")

          status = manifest.get("status", {})
          required_false = {
              "phase17_plus_implementation_published",
              "phase17_result_claimed",
              "phase18_result_claimed",
              "phase_x_result_claimed",
              "phase_y_result_claimed",
              "phase_omega_result_claimed",
              "phase_z_result_claimed",
              "egc0_baseline_completed",
              "general_intelligence_claimed",
          }
          if status.get("roadmap_only") is not True:
              raise SystemExit("roadmap-only flag mismatch")
          if any(status.get(key) is not False for key in required_false):
              raise SystemExit("future implementation/result flag is not false")

          readme = Path("README.md").read_text(encoding="utf-8")
          old_row = (
              "| Executable Core v4 — Phase 15–16 published results "
              "(implementation withheld) |"
          )
          new_row = (
              "| Formal/Executable Core v5 — Phase 17 → 18 → X → Y → Ω → Z "
              "trajectory and EGC-0 → EGC-6 track |  |"
          )
          if readme.count(old_row) != 1:
              raise SystemExit("existing Phase 15–16 row changed or duplicated")
          if readme.count(new_row) != 1:
              raise SystemExit("blank-status v5 roadmap row missing or duplicated")
          if "Phase 15 is next:" in readme:
              raise SystemExit("stale Phase 15 next-boundary text remains")
          if "no Phase 17+ implementation or result is claimed" not in readme:
              raise SystemExit("README roadmap nonclaim missing")

          raw = subprocess.check_output(["git", "ls-files", "-z"])
          tracked = sorted(
              item.decode("utf-8")
              for item in raw.split(b"\0")
              if item and item != b"SHA256SUMS.txt"
          )
          root_listed = {}
          for line in Path("SHA256SUMS.txt").read_text(
              encoding="utf-8"
          ).splitlines():
              digest, relative = line.split("  ", 1)
              root_listed[relative] = digest
          root_actual = {
              relative: git_blob_sha256(relative)
              for relative in tracked
          }
          if root_listed != root_actual:
              missing = sorted(set(root_actual) - set(root_listed))
              extra = sorted(set(root_listed) - set(root_actual))
              mismatch = sorted(
                  name for name in set(root_actual) & set(root_listed)
                  if root_actual[name] != root_listed[name]
              )
              raise SystemExit(
                  f"root checksum mismatch: missing={missing} "
                  f"extra={extra} mismatch={mismatch}"
              )

          print(
              json.dumps(
                  {
                      "accepted": True,
                      "platform": "${{ matrix.label }}",
                      "roadmap_files": len(files),
                      "roadmap_checksum_entries": len(actual),
                      "root_checksum_entries": len(root_actual),
                      "phase17_plus_implementation_published": False,
                      "future_result_claimed": False,
                      "egc0_baseline_completed": False,
                      "gate_e_closed": False,
                  },
                  sort_keys=True,
              )
          )

  publication-surface:
    name: Public-safe roadmap diff
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact roadmap head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ env.ROADMAP_SOURCE_HEAD }}
          fetch-depth: 0

      - name: Reject implementation or unrelated changes
        shell: python
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          import os
          import subprocess
          from pathlib import Path

          event = os.environ["EVENT_NAME"]
          if event == "pull_request":
              base = os.environ["PR_BASE_SHA"]
          elif (
              event == "push"
              and os.environ.get("PUSH_BEFORE_SHA") not in {None, "", "0" * 40}
          ):
              base = os.environ["PUSH_BEFORE_SHA"]
          else:
              base = subprocess.check_output(
                  ["git", "merge-base", "origin/main", "HEAD"], text=True
              ).strip()

          changed = sorted(
              subprocess.check_output(
                  ["git", "diff", "--name-only", base, "HEAD"], text=True
              ).splitlines()
          )
          exact_root = {
              ".github/workflows/v45-results-only-audit.yml",
              ".github/workflows/v5-trajectory-audit.yml",
              "README.md",
              "RELEASE_NOTES.md",
              "SHA256SUMS.txt",
              "docs/roadmaps/README.md",
          }
          allowed = [
              path
              for path in changed
              if path in exact_root or path.startswith("docs/roadmaps/v5/")
          ]
          if changed != allowed:
              raise SystemExit(
                  f"unrelated path in roadmap publication: "
                  f"{sorted(set(changed) - set(allowed))}"
              )

          forbidden_suffixes = {
              ".py", ".lean", ".sh", ".ps1", ".bat",
              ".c", ".h", ".cpp", ".rs", ".go", ".java", ".js", ".ts",
          }
          leaked = [
              path
              for path in changed
              if (
                  ("phase17" in path.lower() or "phase_17" in path.lower())
                  and Path(path).suffix.lower() in forbidden_suffixes
              )
          ]
          if leaked:
              raise SystemExit(f"Phase 17+ implementation path published: {leaked}")

          print(f"PASS: public-safe roadmap diff with {len(changed)} changed paths")
