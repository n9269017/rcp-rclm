name: Finalize RCP/RCLM v5 trajectory draft release

on:
  push:
    branches:
      - agent/v5-trajectory-release-draft-helper
    paths:
      - ".github/workflows/v5-trajectory-draft-release-finalize.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  # Apply only to the exact PR #59 merge commit. The workflow preserves the
  # release as an unpublished prerelease draft and replaces only its notes,
  # target, roadmap ZIP, and checksum asset.
  TARGET_COMMIT: ca79ae182a4f32fa67d265b6d2d2b737ff10557d
  APPLY: "true"
  TAG: v5-trajectory
  TITLE: RCP/RCLM v5 Trajectory
  ASSET: rcp-rclm-v5-trajectory-roadmap.zip

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact corrected roadmap tree
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ env.TARGET_COMMIT }}
          fetch-depth: 0

      - name: Verify exact target and build deterministic corrected assets
        shell: python
        run: |
          from __future__ import annotations

          import hashlib
          import json
          import os
          import subprocess
          import zipfile
          from pathlib import Path

          target = os.environ["TARGET_COMMIT"]
          observed = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          if observed != target:
              raise SystemExit(
                  f"exact target mismatch: expected={target} observed={observed}"
              )

          root = Path("docs/roadmaps/v5")
          expected = {
              "CITATION.cff",
              "DOI_AND_RELEASE_STRATEGY.md",
              "EGC_GENERAL_CAPABILITY_TRACK.md",
              "GITHUB_RELEASE_NOTES.md",
              "PHASE_17_TO_Z_TRAJECTORY.md",
              "PUBLICATION_AND_CLAIM_BOUNDARY.md",
              "README.md",
              "ROADMAP_MANIFEST.json",
              "SHA256SUMS.txt",
          }
          files = sorted(path for path in root.iterdir() if path.is_file())
          if {path.name for path in files} != expected:
              raise SystemExit("roadmap asset file set mismatch")

          manifest = json.loads(
              (root / "ROADMAP_MANIFEST.json").read_text(encoding="utf-8")
          )
          status = manifest.get("status", {})
          predecessor = manifest.get("predecessor_boundary", {})
          if manifest.get("title") != "RCP/RCLM v5 Trajectory":
              raise SystemExit("roadmap title mismatch")
          if manifest.get("version") != "v5-trajectory":
              raise SystemExit("roadmap version mismatch")
          if status.get("roadmap_only") is not True:
              raise SystemExit("roadmap-only boundary mismatch")
          forbidden_true = (
              "phase17_plus_implementation_published",
              "phase17_result_claimed",
              "phase18_result_claimed",
              "phase_x_result_claimed",
              "phase_y_result_claimed",
              "phase_omega_result_claimed",
              "phase_z_result_claimed",
              "egc0_baseline_completed",
              "general_intelligence_claimed",
          )
          for field in forbidden_true:
              if status.get(field) is not False:
                  raise SystemExit(f"future-result boundary mismatch: {field}")
          if predecessor.get("phase16_exit_closed") is not True:
              raise SystemExit("Phase 16 predecessor boundary mismatch")
          if predecessor.get("gate_e_closed") is not False:
              raise SystemExit("Gate E predecessor boundary mismatch")
          if predecessor.get("next_phase") != 17:
              raise SystemExit("next-phase predecessor boundary mismatch")

          for name in (
              "PHASE_17_TO_Z_TRAJECTORY.md",
              "EGC_GENERAL_CAPABILITY_TRACK.md",
              "GITHUB_RELEASE_NOTES.md",
          ):
              text = (root / name).read_text(encoding="utf-8")
              if "\\[" in text or "\\]" in text or "\\(" in text or "\\)" in text:
                  raise SystemExit(f"raw unsupported math delimiter remains: {name}")

          out = Path(os.environ["ASSET"])
          timestamp = (2026, 8, 11, 0, 0, 0)
          with zipfile.ZipFile(
              out,
              mode="w",
              compression=zipfile.ZIP_DEFLATED,
              compresslevel=9,
          ) as archive:
              for path in files:
                  relative = Path("rcp-rclm-v5-trajectory") / path.name
                  info = zipfile.ZipInfo(relative.as_posix(), date_time=timestamp)
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  info.create_system = 3
                  archive.writestr(info, path.read_bytes())

          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          checksum = Path(f"{out.name}.sha256")
          checksum.write_text(
              f"{digest}  {out.name}\n",
              encoding="ascii",
              newline="\n",
          )
          Path("draft-release-build.json").write_text(
              json.dumps(
                  {
                      "asset": out.name,
                      "asset_sha256": digest,
                      "asset_size": out.stat().st_size,
                      "member_count": len(files),
                      "target_commit": target,
                      "apply": os.environ["APPLY"] == "true",
                  },
                  sort_keys=True,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          print(Path("draft-release-build.json").read_text(encoding="utf-8"))

      - name: Retarget draft, refresh notes, and replace assets
        if: ${{ env.APPLY == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          release_json="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/releases")"
          release_id="$(printf '%s' "$release_json" | jq -r \
            '.[] | select(.tag_name == env.TAG and .draft == true) | .id' \
            | head -n1)"
          if [[ -z "$release_id" || "$release_id" == "null" ]]; then
            echo "Draft release $TAG was not found." >&2
            exit 1
          fi

          gh api --method PATCH \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -f tag_name="$TAG" \
            -f target_commitish="$TARGET_COMMIT" \
            -f name="$TITLE" \
            -F draft=true \
            -F prerelease=true \
            --raw-field body="$(cat docs/roadmaps/v5/GITHUB_RELEASE_NOTES.md)" \
            >/dev/null

          for asset_name in "$ASSET" "$ASSET.sha256"; do
            asset_id="$(printf '%s' "$release_json" | jq -r \
              --arg tag "$TAG" --arg name "$asset_name" \
              '.[] | select(.tag_name == $tag and .draft == true) \
               | .assets[]? | select(.name == $name) | .id' \
              | head -n1)"
            if [[ -n "$asset_id" && "$asset_id" != "null" ]]; then
              gh api --method DELETE \
                -H 'Accept: application/vnd.github+json' \
                "/repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            fi
          done

          gh release upload "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            "$ASSET" \
            "$ASSET.sha256"

      - name: Verify draft-release boundary
        if: ${{ env.APPLY == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          from __future__ import annotations

          import hashlib
          import json
          import os
          import subprocess

          records = json.loads(
              subprocess.check_output(
                  [
                      "gh", "api",
                      f"/repos/{os.environ['GITHUB_REPOSITORY']}/releases",
                  ],
                  text=True,
              )
          )
          matches = [
              record for record in records
              if record.get("tag_name") == os.environ["TAG"]
              and record.get("draft") is True
          ]
          if len(matches) != 1:
              raise SystemExit(f"expected one draft release; observed {len(matches)}")
          record = matches[0]
          if record.get("prerelease") is not True:
              raise SystemExit("draft is not marked as a prerelease")
          if record.get("published_at") is not None:
              raise SystemExit("draft release was unexpectedly published")
          if record.get("target_commitish") != os.environ["TARGET_COMMIT"]:
              raise SystemExit("draft target mismatch")

          assets = {asset["name"]: asset for asset in record.get("assets", [])}
          expected = {
              os.environ["ASSET"],
              f"{os.environ['ASSET']}.sha256",
          }
          if set(assets) != expected:
              raise SystemExit(f"draft asset set mismatch: {sorted(assets)}")

          local_digest = hashlib.sha256(
              open(os.environ["ASSET"], "rb").read()
          ).hexdigest()
          remote_digest = assets[os.environ["ASSET"]].get("digest")
          if remote_digest != f"sha256:{local_digest}":
              raise SystemExit(
                  f"draft ZIP digest mismatch: local={local_digest} remote={remote_digest}"
              )
          print(
              json.dumps(
                  {
                      "release_id": record["id"],
                      "draft": record["draft"],
                      "prerelease": record["prerelease"],
                      "published_at": record["published_at"],
                      "target_commitish": record["target_commitish"],
                      "assets": sorted(assets),
                      "asset_sha256": local_digest,
                  },
                  sort_keys=True,
                  indent=2,
              )
          )

      - name: Upload dry-run build evidence
        if: ${{ env.APPLY != 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v5-trajectory-corrected-draft-assets-dry-run
          path: |
            rcp-rclm-v5-trajectory-roadmap.zip
            rcp-rclm-v5-trajectory-roadmap.zip.sha256
            draft-release-build.json
          if-no-files-found: error
          retention-days: 7
