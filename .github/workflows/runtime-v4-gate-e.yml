name: Runtime v4 Gate E autonomous search contract

on:
  pull_request:
    branches:
      - main
    paths:
      - "python/rcp_rclm_runtime_v4/**"
      - "python/rcp_rclm_executable_core_v4/**"
      - "docs/executable_core_v4/**"
      - "scripts/run_gate_e_reference.py"
      - ".github/workflows/runtime-v4-gate-e.yml"
  push:
    branches:
      - agent/rcp-rclm-v4-gate-e-successor-availability
    paths:
      - "python/rcp_rclm_runtime_v4/**"
      - "python/rcp_rclm_executable_core_v4/**"
      - "docs/executable_core_v4/**"
      - "scripts/run_gate_e_reference.py"
      - ".github/workflows/runtime-v4-gate-e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  contract:
    name: Validate Gate E contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python-version:
          - "3.11"

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Runtime v2 canonical foundation
        run: python -m pip install --disable-pip-version-check --no-deps -e python/rcp_rclm_runtime_v2

      - name: Install Runtime v4 and schema validator
        run: python -m pip install --disable-pip-version-check -e "python/rcp_rclm_runtime_v4[test]"

      - name: Compile Gate E Python source
        run: >-
          python -m compileall -q
          python/rcp_rclm_runtime_v4
          scripts/run_gate_e_reference.py

      - name: Validate deterministic source quality
        run: >-
          python python/rcp_rclm_runtime_v4/tools/validate_source_quality.py
          --package-root python/rcp_rclm_runtime_v4
          --out artifacts/runtime_v4_gate_e/${{ matrix.os }}/source_quality.json

      - name: Run focused Gate E tests
        run: >-
          python python/rcp_rclm_runtime_v4/tools/run_gate_e_tests.py
          --package-root python/rcp_rclm_runtime_v4
          --out artifacts/runtime_v4_gate_e/${{ matrix.os }}/gate_e_tests.log

      - name: Generate promotion reference through package tool
        run: >-
          python python/rcp_rclm_runtime_v4/tools/run_gate_e_reference.py
          --mode promotion
          --report-out artifacts/runtime_v4_gate_e/${{ matrix.os }}/promotion_tool.json
          --validation-out artifacts/runtime_v4_gate_e/${{ matrix.os }}/promotion_tool_validation.json

      - name: Generate promotion reference through repository entry point
        run: >-
          python scripts/run_gate_e_reference.py
          --mode promotion
          --report-out artifacts/runtime_v4_gate_e/${{ matrix.os }}/promotion_entry.json
          --validation-out artifacts/runtime_v4_gate_e/${{ matrix.os }}/promotion_entry_validation.json

      - name: Generate exhaustion reference through package tool
        run: >-
          python python/rcp_rclm_runtime_v4/tools/run_gate_e_reference.py
          --mode exhaustion
          --report-out artifacts/runtime_v4_gate_e/${{ matrix.os }}/exhaustion_tool.json
          --validation-out artifacts/runtime_v4_gate_e/${{ matrix.os }}/exhaustion_tool_validation.json

      - name: Generate exhaustion reference through repository entry point
        run: >-
          python scripts/run_gate_e_reference.py
          --mode exhaustion
          --report-out artifacts/runtime_v4_gate_e/${{ matrix.os }}/exhaustion_entry.json
          --validation-out artifacts/runtime_v4_gate_e/${{ matrix.os }}/exhaustion_entry_validation.json

      - name: Require byte-identical tool and repository outputs
        shell: python
        run: |
          from pathlib import Path

          root = Path("artifacts/runtime_v4_gate_e/${{ matrix.os }}")
          pairs = (
              ("promotion_tool.json", "promotion_entry.json"),
              ("promotion_tool_validation.json", "promotion_entry_validation.json"),
              ("exhaustion_tool.json", "exhaustion_entry.json"),
              ("exhaustion_tool_validation.json", "exhaustion_entry_validation.json"),
          )
          for left, right in pairs:
              if (root / left).read_bytes() != (root / right).read_bytes():
                  raise SystemExit(f"entry-point mismatch: {left} != {right}")

      - name: Validate promotion Draft 2020-12 schema and hashes
        run: >-
          python python/rcp_rclm_runtime_v4/tools/validate_gate_e_schema.py
          --schema python/rcp_rclm_executable_core_v4/contract/gate_e_autonomous_search.schema.json
          --instance artifacts/runtime_v4_gate_e/${{ matrix.os }}/promotion_tool.json
          --out artifacts/runtime_v4_gate_e/${{ matrix.os }}/promotion_schema_validation.json

      - name: Validate exhaustion Draft 2020-12 schema and hashes
        run: >-
          python python/rcp_rclm_runtime_v4/tools/validate_gate_e_schema.py
          --schema python/rcp_rclm_executable_core_v4/contract/gate_e_autonomous_search.schema.json
          --instance artifacts/runtime_v4_gate_e/${{ matrix.os }}/exhaustion_tool.json
          --out artifacts/runtime_v4_gate_e/${{ matrix.os }}/exhaustion_schema_validation.json

      - name: Upload platform evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-v4-gate-e-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/runtime_v4_gate_e/${{ matrix.os }}/
          if-no-files-found: error
          retention-days: 90
