name: Temporary Phase 14 capture replay pin fix

on:
  push:
    branches:
      - agent/rcp-rclm-v4-phase-14-schedule-free-loop-v2
    paths:
      - .github/workflows/phase14-capture-pinned-replay-fix.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase14-capture-pinned-replay-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Phase 14 branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: agent/rcp-rclm-v4-phase-14-schedule-free-loop-v2
          fetch-depth: 0

      - name: Pin capture-side worker-free replay to Formal Core v3
        shell: python
        run: |
          from pathlib import Path

          workflow = Path('.github/workflows/runtime-v4-phase-14.yml')
          text = workflow.read_text(encoding='utf-8')
          old = '''          python python/rcp_rclm_runtime_v4/tools/replay_phase14_bundle.py
          --bundle-root artifacts/runtime_v4_phase14/capture_export/phase14_bundle
          --repo-root .
          --source-head "$PHASE14_SOURCE_HEAD"
'''
          new = '''          python python/rcp_rclm_runtime_v4/tools/replay_phase14_bundle.py
          --bundle-root artifacts/runtime_v4_phase14/capture_export/phase14_bundle
          --repo-root .
          --lean-project-root lean/rcp_rclm_formal_core_v3
          --source-head "$PHASE14_SOURCE_HEAD"
'''
          if text.count(old) != 1:
              raise SystemExit('capture-side replay command did not match exactly once')
          workflow.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

      - name: Regenerate canonical tracked-file checksum manifest
        shell: python
        run: |
          import hashlib
          import subprocess
          from pathlib import Path

          excluded = {
              'SHA256SUMS.txt',
              '.github/workflows/phase14-capture-pinned-replay-fix.yml',
          }
          raw = subprocess.check_output(['git', 'ls-files', '-z'])
          paths = [item.decode('utf-8') for item in raw.split(b'\0') if item]
          retained = sorted(
              (path for path in paths if path not in excluded),
              key=lambda path: path.encode('utf-8'),
          )
          lines = []
          for path in retained:
              content = subprocess.check_output(['git', 'show', f'HEAD:{path}'])
              if path == '.github/workflows/runtime-v4-phase-14.yml':
                  content = Path(path).read_bytes()
              lines.append(f'{hashlib.sha256(content).hexdigest()}  {path}')
          Path('SHA256SUMS.txt').write_text(
              '\n'.join(lines) + '\n',
              encoding='utf-8',
              newline='\n',
          )

      - name: Commit final source-neutral repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase14-capture-pinned-replay-fix.yml
          git add .github/workflows/runtime-v4-phase-14.yml SHA256SUMS.txt
          git diff --cached --check
          git commit -m "Pin Phase 14 capture replay to Formal Core v3"
          git push origin HEAD:agent/rcp-rclm-v4-phase-14-schedule-free-loop-v2
