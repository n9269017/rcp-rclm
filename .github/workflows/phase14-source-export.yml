name: Temporary Phase 14 source export

on:
  push:
    branches:
      - agent/rcp-rclm-v4-phase-14-schedule-free-loop
    paths:
      - .github/workflows/phase14-source-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: agent/rcp-rclm-v4-phase-14-schedule-free-loop
          fetch-depth: 0
      - name: Export repository source without Git metadata
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude='./.git' \
            --exclude='./.lake' \
            --exclude='*/__pycache__' \
            -czf /tmp/rcp-rclm-phase14-source.tar.gz .
          sha256sum /tmp/rcp-rclm-phase14-source.tar.gz > /tmp/rcp-rclm-phase14-source.sha256
      - name: Upload source bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rcp-rclm-phase14-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/rcp-rclm-phase14-source.tar.gz
            /tmp/rcp-rclm-phase14-source.sha256
          if-no-files-found: error
          retention-days: 1
