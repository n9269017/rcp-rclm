name: Temporary v4 Phase 14 Zenodo DOI probe

on:
  push:
    branches:
      - agent/v4-phase14-zenodo-doi-synchronization
    paths:
      - .github/workflows/v4-phase14-zenodo-doi-synchronization.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out probe branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: agent/v4-phase14-zenodo-doi-synchronization
          fetch-depth: 0

      - name: Query exact public Zenodo records
        shell: python
        run: |
          from __future__ import annotations

          import json
          import urllib.request
          from pathlib import Path

          def fetch(record_id: str) -> dict[str, object]:
              request = urllib.request.Request(
                  f"https://zenodo.org/api/records/{record_id}",
                  headers={
                      "Accept": "application/json",
                      "User-Agent": "rcp-rclm-zenodo-probe/1.0 (https://github.com/n9269017/rcp-rclm)",
                  },
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.loads(response.read().decode("utf-8"))

          def nested(value: object, *keys: str) -> object | None:
              current = value
              for key in keys:
                  if not isinstance(current, dict):
                      return None
                  current = current.get(key)
              return current

          def version_doi(record: dict[str, object]) -> str:
              for value in (
                  record.get("doi"),
                  nested(record, "pids", "doi", "identifier"),
                  nested(record, "metadata", "doi"),
              ):
                  if isinstance(value, str) and value:
                      return value
              raise SystemExit("version DOI missing")

          def concept_doi(record: dict[str, object]) -> str:
              for value in (
                  record.get("conceptdoi"),
                  nested(record, "parent", "pids", "doi", "identifier"),
                  nested(record, "metadata", "conceptdoi"),
              ):
                  if isinstance(value, str) and value:
                      return value
              raise SystemExit("concept DOI missing")

          software = fetch("21710858")
          paper_i = fetch("21710273")
          paper_ii = fetch("21710376")
          metadata = software.get("metadata")
          if not isinstance(metadata, dict):
              metadata = {}

          output = {
              "software_record_id": "21710858",
              "software_version_doi": version_doi(software),
              "software_concept_doi": concept_doi(software),
              "software_title": metadata.get("title"),
              "software_version": metadata.get("version"),
              "software_publication_date": metadata.get("publication_date"),
              "software_resource_type": metadata.get("resource_type") or metadata.get("upload_type"),
              "software_creators": metadata.get("creators"),
              "software_license": metadata.get("license") or metadata.get("rights"),
              "software_related_identifiers": metadata.get("related_identifiers"),
              "software_access_right": metadata.get("access_right"),
              "paper_i_doi": version_doi(paper_i),
              "paper_ii_doi": version_doi(paper_ii),
          }
          Path("zenodo_metadata_probe.json").write_text(
              json.dumps(output, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          print(json.dumps(output, indent=2, sort_keys=True))

      - name: Commit probe result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zenodo_metadata_probe.json
          git commit -m "Record public Zenodo DOI probe [skip ci]"
          git push origin HEAD:agent/v4-phase14-zenodo-doi-synchronization
