name: Temporary Phase 14 checksum regenerator

on:
  push:
    branches:
      - agent/rcp-rclm-v4-phase-14-schedule-free-loop-v2
    paths:
      - .github/workflows/phase14-checksum-regenerator.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Phase 14 branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: agent/rcp-rclm-v4-phase-14-schedule-free-loop-v2
          fetch-depth: 0

      - name: Regenerate canonical tracked-file checksum manifest
        shell: python
        run: |
          import hashlib
          import subprocess
          from pathlib import Path

          excluded = {
              "SHA256SUMS.txt",
              ".github/workflows/phase14-checksum-regenerator.yml",
          }
          raw = subprocess.check_output(["git", "ls-files", "-z"])
          paths = [
              item.decode("utf-8")
              for item in raw.split(b"\0")
              if item
          ]
          retained = sorted(
              (path for path in paths if path not in excluded),
              key=lambda path: path.encode("utf-8"),
          )
          lines = []
          for path in retained:
              content = subprocess.check_output(["git", "show", f"HEAD:{path}"])
              lines.append(f"{hashlib.sha256(content).hexdigest()}  {path}")
          Path("SHA256SUMS.txt").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
              newline="\n",
          )

      - name: Commit final source-neutral checksum result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase14-checksum-regenerator.yml
          git add SHA256SUMS.txt
          git diff --cached --check
          git commit -m "Regenerate Phase 14 checksum after trajectory CLI fix"
          git push origin HEAD:agent/rcp-rclm-v4-phase-14-schedule-free-loop-v2
